<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa Rápido Móvel Pro</title>
  
  <!-- Estilos e Design (Tailwind CSS + FontAwesome) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    .whatsapp-green { background-color: #075e54; }
    .whatsapp-teal { background-color: #128c7e; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- BARRA SUPERIOR (HEADER) ESTILO WHATSAPP -->
  <header class="whatsapp-green text-white p-3.5 flex justify-between items-center shadow-md z-10">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-cash-register text-2xl text-green-300"></i>
      <div>
        <h1 id="header-app-name" class="font-bold text-base leading-tight">Caixa Rápido Móvel Pro</h1>
        <p id="user-status" class="text-xs text-green-200">Verificando conexão...</p>
      </div>
    </div>
    
    <!-- MENU DE TRÊS PONTINHOS (⋮) -->
    <div class="relative">
      <button id="btn-menu" class="text-white p-2 text-xl focus:outline-none">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>

      <!-- DROPDOWN DO MENU -->
      <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-white text-gray-800 rounded-md shadow-xl border border-gray-200 z-50">
        <button onclick="openModalPerfil()" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center gap-2 text-xs"><i class="fa-solid fa-store text-teal-600"></i> Perfil do Negócio</button>
        <button onclick="exportarBackupCSV()" class="w-full text-left px-4 py-2.5 hover:bg-gray-100 flex items-center gap-2 text-xs"><i class="fa-solid fa-file-excel text-green-600"></i> Exportar Vendas (Excel)</button>
        <hr class="my-1 border-gray-200">
        <button id="menu-logout" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-red-600 flex items-center gap-2 text-xs"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 overflow-y-auto p-3 max-w-md mx-auto w-full mb-16">
    <div id="main-content" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <div class="text-center py-8">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-teal-600 mb-3"></i>
        <p class="text-gray-600 font-medium text-sm">Carregando o aplicativo...</p>
      </div>
    </div>
  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR POR ABAS -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 z-40 max-w-md mx-auto">
    <button onclick="switchTab('vendas')" id="nav-vendas" class="flex flex-col items-center text-teal-700 font-bold text-[11px]">
      <i class="fa-solid fa-cart-shopping text-lg"></i>
      <span>Caixa</span>
    </button>
    <button onclick="switchTab('estoque')" id="nav-estoque" class="flex flex-col items-center text-gray-400 font-medium text-[11px]">
      <i class="fa-solid fa-boxes-stacked text-lg"></i>
      <span>Estoque</span>
    </button>
    <button onclick="switchTab('clientes')" id="nav-clientes" class="flex flex-col items-center text-gray-400 font-medium text-[11px]">
      <i class="fa-solid fa-users text-lg"></i>
      <span>Fiado / Clientes</span>
    </button>
    <button onclick="switchTab('relatorios')" id="nav-relatorios" class="flex flex-col items-center text-gray-400 font-medium text-[11px]">
      <i class="fa-solid fa-chart-line text-lg"></i>
      <span>Relatórios</span>
    </button>
  </nav>

  <!-- MODAL: PERFIL DO NEGÓCIO -->
  <div id="modal-perfil" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-5 max-w-sm w-full space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800 text-sm"><i class="fa-solid fa-store text-teal-600"></i> Perfil do Negócio</h3>
        <button onclick="closeModalPerfil()" class="text-gray-500 text-xl font-bold">&times;</button>
      </div>
      <form onsubmit="salvarPerfilNegocio(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Estabelecimento / Loja</label>
          <input type="text" id="perfil-nome-loja" required class="w-full p-2 border rounded-lg text-xs">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Natureza do Negócio</label>
          <select id="perfil-tipo-registro" class="w-full p-2 border rounded-lg text-xs bg-white">
            <option value="PF">Pessoa Física (Autônomo)</option>
            <option value="MEI">MEI (Microempreendedor)</option>
            <option value="ME">Microempresa (ME)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ramo de Atuação</label>
          <select id="perfil-ramo" class="w-full p-2 border rounded-lg text-xs bg-white">
            <option value="Produtos">Venda de Produtos</option>
            <option value="Servicos">Prestação de Serviços</option>
            <option value="Ambos">Produtos e Serviços</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg hover:bg-teal-700 transition text-xs">
          Salvar Alterações
        </button>
      </form>
    </div>
  </div>

  <!-- BIBLIOTECAS DO FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- LÓGICA DO APLICATIVO -->
  <script>
    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDlmmLaKNqlaze-Rreqw2cOWBhXoebeG7g",
      authDomain: "caixa-rapido-movel.firebaseapp.com",
      projectId: "caixa-rapido-movel",
      storageBucket: "caixa-rapido-movel.firebasestorage.app",
      messagingSenderId: "741349314946",
      appId: "1:741349314946:web:640b8d2baa0e257ed13f9b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Produtos Padrões de Exemplo (se o estoque estiver vazio no primeiro acesso)
    const produtosExemplo = [
      { id: 1, nome: "Café 500g", preco: 16.50, estoque: 15, medida: "un", validade: "2026-12-31", atalho: true },
      { id: 2, nome: "Açúcar 1kg", preco: 4.80, estoque: 20, medida: "kg", validade: "2027-05-10", atalho: true },
      { id: 3, nome: "Leite Integral 1L", preco: 5.50, estoque: 12, medida: "L", validade: "2026-11-20", atalho: true },
      { id: 4, nome: "Pão Francês (kg)", preco: 14.00, estoque: 8, medida: "kg", validade: "", atalho: true }
    ];

    // Estado e Dados Locais
    let produtos = JSON.parse(localStorage.getItem('crm_produtos')) || produtosExemplo;
    let vendas = JSON.parse(localStorage.getItem('crm_vendas')) || [];
    let clientes = JSON.parse(localStorage.getItem('crm_clientes')) || [
      { id: 101, nome: "João Silva", telefone: "(75) 99999-1111", debito: 25.00 }
    ];
    let carrinho = [];
    let abaAtual = 'vendas';
    let perfilTemp = { nomeLoja: '', tipo: 'PF', ramo: 'Produtos' };
    let perfilNegocio = JSON.parse(localStorage.getItem('crm_perfil')) || { nomeLoja: 'Caixa Rápido Móvel Pro', tipo: 'PF', ramo: 'Produtos' };

    // Menu Dropdown
    const btnMenu = document.getElementById('btn-menu');
    const dropdownMenu = document.getElementById('dropdown-menu');

    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
    });

    function openModalPerfil() {
      document.getElementById('perfil-nome-loja').value = perfilNegocio.nomeLoja || '';
      document.getElementById('perfil-tipo-registro').value = perfilNegocio.tipo || 'PF';
      document.getElementById('perfil-ramo').value = perfilNegocio.ramo || 'Produtos';
      document.getElementById('modal-perfil').classList.remove('hidden');
    }

    function closeModalPerfil() {
      document.getElementById('modal-perfil').classList.add('hidden');
    }

    function salvarPerfilNegocio(e) {
      e.preventDefault();
      perfilNegocio = {
        nomeLoja: document.getElementById('perfil-nome-loja').value,
        tipo: document.getElementById('perfil-tipo-registro').value,
        ramo: document.getElementById('perfil-ramo').value
      };

      localStorage.setItem('crm_perfil', JSON.stringify(perfilNegocio));
      document.getElementById('header-app-name').innerText = perfilNegocio.nomeLoja;

      const user = auth.currentUser;
      if (user) {
        db.collection("perfis").doc(user.uid).set(perfilNegocio, { merge: true });
      }

      closeModalPerfil();
      renderAba();
      alert("Perfil atualizado!");
    }

    // ONBOARDING INICIAL
    function showOnboardingStep1() {
      document.getElementById('bottom-nav').classList.add('hidden');
      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <div class="text-center">
            <i class="fa-solid fa-store text-4xl text-teal-600 mb-2"></i>
            <h2 class="text-xl font-bold text-gray-800">Seja Bem-Vindo!</h2>
            <p class="text-xs text-gray-500">Configure o perfil do seu negócio para iniciar</p>
          </div>

          <form onsubmit="handleOnboardingStep1(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Nome da sua Loja ou Negócio</label>
              <input type="text" id="step1-nome" required placeholder="Ex: Mercado do Povo" class="w-full p-2.5 border rounded-lg text-xs">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Natureza do Negócio</label>
              <select id="step1-tipo" class="w-full p-2.5 border rounded-lg text-xs bg-white">
                <option value="PF">Pessoa Física (Autônomo / Informal)</option>
                <option value="MEI">MEI (Microempreendedor Individual)</option>
                <option value="ME">Microempresa (ME)</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Ramo de Atuação</label>
              <select id="step1-ramo" class="w-full p-2.5 border rounded-lg text-xs bg-white">
                <option value="Produtos">Venda de Produtos</option>
                <option value="Servicos">Prestação de Serviços</option>
                <option value="Ambos">Produtos e Serviços</option>
              </select>
            </div>

            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-lg hover:bg-teal-700 transition text-xs">
              Avançar para Criar Conta <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
          </form>

          <div class="border-t pt-3 text-center">
            <p class="text-xs text-gray-600">Já possui uma conta?</p>
            <button onclick="showLoginForm()" class="text-xs font-bold text-teal-700 hover:underline mt-1">Fazer Login</button>
          </div>
        </div>
      `;
    }

    function handleOnboardingStep1(e) {
      e.preventDefault();
      perfilTemp = {
        nomeLoja: document.getElementById('step1-nome').value,
        tipo: document.getElementById('step1-tipo').value,
        ramo: document.getElementById('step1-ramo').value
      };
      showRegisterForm();
    }

    function showRegisterForm() {
      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <div class="text-center">
            <i class="fa-solid fa-user-plus text-4xl text-teal-600 mb-2"></i>
            <h2 class="text-xl font-bold text-gray-800">Criar Sua Conta</h2>
            <p class="text-xs text-gray-500">Configuração para: <b>${perfilTemp.nomeLoja}</b></p>
          </div>

          <form onsubmit="handleRegister(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail de acesso</label>
              <input type="email" id="reg-email" required placeholder="seu@email.com" class="w-full p-2.5 border rounded-lg text-xs">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Senha (mínimo 6 dígitos)</label>
              <input type="password" id="reg-password" required minlength="6" placeholder="******" class="w-full p-2.5 border rounded-lg text-xs">
            </div>
            
            <p id="auth-error" class="text-xs text-red-500 font-medium hidden text-center"></p>

            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-lg hover:bg-teal-700 transition text-xs">
              Concluir e Abrir Caixa
            </button>
          </form>

          <div class="border-t pt-3 text-center">
            <button onclick="showOnboardingStep1()" class="text-xs font-bold text-gray-500 hover:underline">← Voltar para perfil</button>
          </div>
        </div>
      `;
    }

    function showLoginForm() {
      document.getElementById('bottom-nav').classList.add('hidden');
      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <div class="text-center">
            <i class="fa-solid fa-user-check text-4xl text-teal-600 mb-2"></i>
            <h2 class="text-xl font-bold text-gray-800">Entrar na Conta</h2>
            <p class="text-xs text-gray-500">Acesse suas vendas na nuvem</p>
          </div>

          <form onsubmit="handleLogin(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
              <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full p-2.5 border rounded-lg text-xs">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Senha</label>
              <input type="password" id="login-password" required placeholder="******" class="w-full p-2.5 border rounded-lg text-xs">
            </div>
            
            <p id="auth-error" class="text-xs text-red-500 font-medium hidden text-center"></p>

            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-lg hover:bg-teal-700 transition text-xs">
              Entrar
            </button>
          </form>

          <div class="border-t pt-3 text-center">
            <p class="text-xs text-gray-600">Primeiro acesso?</p>
            <button onclick="showOnboardingStep1()" class="text-xs font-bold text-teal-700 hover:underline mt-1">Configurar Novo Negócio</button>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const errBox = document.getElementById('auth-error');

      errBox.classList.add('hidden');
      auth.signInWithEmailAndPassword(email, pass).catch(err => {
        errBox.innerText = "Erro ao entrar: E-mail ou senha incorretos.";
        errBox.classList.remove('hidden');
      });
    }

    function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;
      const errBox = document.getElementById('auth-error');

      errBox.classList.add('hidden');
      auth.createUserWithEmailAndPassword(email, pass).then((userCredential) => {
        perfilNegocio = { ...perfilTemp };
        localStorage.setItem('crm_perfil', JSON.stringify(perfilNegocio));
        db.collection("perfis").doc(userCredential.user.uid).set(perfilNegocio);
      }).catch(err => {
        errBox.innerText = "Erro ao cadastrar: " + (err.message.includes("email-already-in-use") ? "Este e-mail já está cadastrado." : err.message);
        errBox.classList.remove('hidden');
      });
    }

    // ALTERNÂNCIA DE ABAS
    function switchTab(aba) {
      abaAtual = aba;
      ['vendas', 'estoque', 'clientes', 'relatorios'].forEach(a => {
        const btn = document.getElementById('nav-' + a);
        if (a === aba) {
          btn.className = "flex flex-col items-center text-teal-700 font-bold text-[11px]";
        } else {
          btn.className = "flex flex-col items-center text-gray-400 font-medium text-[11px]";
        }
      });
      renderAba();
    }

    function renderAba() {
      document.getElementById('bottom-nav').classList.remove('hidden');
      document.getElementById('header-app-name').innerText = perfilNegocio.nomeLoja || 'Caixa Rápido Móvel Pro';

      if (abaAtual === 'vendas') renderAbaVendas();
      else if (abaAtual === 'estoque') renderAbaEstoque();
      else if (abaAtual === 'clientes') renderAbaClientes();
      else if (abaAtual === 'relatorios') renderAbaRelatorios();
    }

    // ABA 1: CAIXA / VENDAS
    function renderAbaVendas() {
      const hojeStr = new Date().toLocaleDateString('pt-BR');
      const vendasHoje = vendas.filter(v => v.data && v.data.includes(hojeStr));
      const totalHoje = vendasHoje.reduce((acc, v) => acc + parseFloat(v.valor), 0);
      const totalPix = vendasHoje.filter(v => v.formaPagto === 'PIX').reduce((acc, v) => acc + parseFloat(v.valor), 0);
      const totalDinheiro = vendasHoje.filter(v => v.formaPagto === 'Dinheiro').reduce((acc, v) => acc + parseFloat(v.valor), 0);

      let atalhosProdutos = produtos.filter(p => p.atalho !== false);
      let atalhosProdutosHTML = atalhosProdutos.map((p, i) => {
        let idxReal = produtos.findIndex(prod => prod.id === p.id);
        return `
          <button onclick="adicionarAoCarrinho(${idxReal})" class="bg-teal-50 border border-teal-200 hover:bg-teal-100 p-2.5 rounded-lg text-left flex flex-col justify-between h-20 transition shadow-sm">
            <span class="font-bold text-gray-800 text-xs line-clamp-1">${p.nome}</span>
            <div class="flex justify-between items-center w-full mt-1">
              <span class="text-[10px] text-gray-500">Est: <b>${p.estoque || 0} ${p.medida || 'un'}</b></span>
              <span class="font-extrabold text-teal-800 text-xs">R$ ${parseFloat(p.preco).toFixed(2)}</span>
            </div>
          </button>
        `;
      }).join('');

      let totalCarrinho = carrinho.reduce((acc, item) => acc + (item.preco * item.qtd), 0);
      let carrinhoHTML = carrinho.map((item, index) => `
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-xs">
          <div>
            <p class="font-bold text-gray-800">${item.nome}</p>
            <p class="text-gray-500">${item.qtd}x R$ ${item.preco.toFixed(2)}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-teal-700">R$ ${(item.preco * item.qtd).toFixed(2)}</span>
            <button onclick="removerDoCarrinho(${index})" class="text-red-500 font-bold px-1.5 py-0.5 hover:bg-red-100 rounded">&times;</button>
          </div>
        </div>
      `).join('');

      let clientesOptionsHTML = clientes.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <!-- RESUMO DO DIA -->
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-teal-600 text-white p-3 rounded-lg shadow-sm">
              <p class="text-[10px] text-teal-100 uppercase font-bold">Vendido Hoje</p>
              <p class="text-lg font-extrabold mt-0.5">R$ ${totalHoje.toFixed(2)}</p>
              <p class="text-[10px] text-teal-200 mt-0.5">${vendasHoje.length} venda(s)</p>
            </div>
            
            <div class="bg-gray-800 text-white p-3 rounded-lg shadow-sm flex flex-col justify-between">
              <div>
                <p class="text-[10px] text-gray-300">PIX: <b class="text-white">R$ ${totalPix.toFixed(2)}</b></p>
                <p class="text-[10px] text-gray-300">Dinheiro: <b class="text-white">R$ ${totalDinheiro.toFixed(2)}</b></p>
              </div>
              <span class="text-[9px] text-teal-400 font-semibold">Resumo Automático</span>
            </div>
          </div>

          <!-- ATALHOS RÁPIDOS DA TELA INICIAL -->
          <div class="border-t pt-3 space-y-2">
            <div class="flex justify-between items-center">
              <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-teal-600"></i> Atalhos para Venda Rápida
              </h2>
            </div>
            <div class="grid grid-cols-2 gap-2 max-h-44 overflow-y-auto p-1">
              ${atalhosProdutosHTML || '<p class="text-xs text-gray-400 italic col-span-2 text-center py-3 border border-dashed rounded-lg">Sem produtos marcados para atalho.</p>'}
            </div>
          </div>

          <!-- CARRINHO -->
          <div class="border-t pt-3 space-y-2">
            <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-cart-shopping text-teal-600"></i> Carrinho do Caixa
            </h2>

            <div class="grid grid-cols-3 gap-2">
              <input type="text" id="venda-nome-manual" placeholder="Item Avulso" class="col-span-2 p-2 border rounded-lg text-xs">
              <input type="number" step="0.01" id="venda-valor-manual" placeholder="Valor R$" class="p-2 border rounded-lg text-xs">
            </div>
            <button onclick="adicionarManualAoCarrinho()" class="w-full bg-gray-100 text-gray-700 font-semibold py-1 rounded-lg border hover:bg-gray-200 text-xs">
              + Adicionar Item Avulso
            </button>

            <div class="space-y-1.5 max-h-32 overflow-y-auto">
              ${carrinhoHTML || '<p class="text-xs text-gray-400 italic text-center py-2">Carrinho vazio.</p>'}
            </div>

            <div class="bg-gray-50 p-2.5 rounded-lg border space-y-2">
              <div class="flex justify-between items-center font-bold text-xs text-gray-800">
                <span>Total:</span>
                <span class="text-teal-700 text-base">R$ ${totalCarrinho.toFixed(2)}</span>
              </div>

              <div class="space-y-2">
                <select id="venda-pagto" onchange="toggleClienteFiadoSelect()" class="w-full p-2 border rounded-lg text-xs bg-white">
                  <option value="PIX">PIX</option>
                  <option value="Dinheiro">Dinheiro</option>
                  <option value="Cartão de Crédito">Cartão de Crédito</option>
                  <option value="Cartão de Débito">Cartão de Débito</option>
                  <option value="Fiado">Fiado / A Prazo</option>
                </select>

                <div id="select-cliente-fiado-box" class="hidden">
                  <label class="block text-[10px] font-semibold text-gray-500 mb-0.5">Selecione o Cliente do Fiado:</label>
                  <select id="venda-cliente-fiado" class="w-full p-2 border border-red-300 rounded-lg text-xs bg-red-50">
                    <option value="">-- Escolher Cliente Cadastrado --</option>
                    ${clientesOptionsHTML}
                  </select>
                </div>

                <button onclick="finalizarCarrinho()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg hover:bg-teal-700 transition text-xs shadow">
                  Finalizar Venda
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleClienteFiadoSelect() {
      const pagto = document.getElementById('venda-pagto').value;
      const box = document.getElementById('select-cliente-fiado-box');
      if (pagto === 'Fiado') {
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    // ABA 2: ESTOQUE, UNIDADES, VALIDADE E ALERTAS
    function renderAbaEstoque() {
      let listaEstoqueHTML = produtos.map((p, i) => {
        let ehAlertaEstoque = p.estoque <= 3;
        return `
          <div class="flex justify-between items-center ${ehAlertaEstoque ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'} p-2.5 rounded-lg border text-xs">
            <div>
              <p class="font-bold text-gray-800">${p.nome} ${ehAlertaEstoque ? '<span class="text-[9px] bg-red-200 text-red-800 px-1 rounded">Estoque Baixo!</span>' : ''}</p>
              <p class="text-gray-500">Qtd: <span class="font-bold text-teal-700">${p.estoque || 0} ${p.medida || 'un'}</span> ${p.validade ? '• Val: ' + p.validade : ''}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-gray-800">R$ ${parseFloat(p.preco).toFixed(2)}</span>
              <button onclick="excluirProduto(${i})" class="text-red-500 text-xs p-1 hover:bg-red-50 rounded"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider flex items-center gap-1.5 border-b pb-2">
            <i class="fa-solid fa-boxes-stacked text-teal-600"></i> Gestão de Estoque, Unidades & Validade
          </h2>

          <div class="space-y-2">
            <input type="text" id="cad-prod-nome" placeholder="Nome do Produto / Serviço" class="w-full p-2 border rounded-lg text-xs">
            
            <div class="grid grid-cols-3 gap-2">
              <input type="number" step="0.01" id="cad-prod-preco" placeholder="Preço R$" class="p-2 border rounded-lg text-xs">
              <input type="number" id="cad-prod-qtd" placeholder="Qtd" class="p-2 border rounded-lg text-xs">
              <select id="cad-prod-medida" class="p-2 border rounded-lg text-xs bg-white">
                <option value="un">Unidade (un)</option>
                <option value="kg">Quilograma (kg)</option>
                <option value="g">Grama (g)</option>
                <option value="L">Litro (L)</option>
                <option value="cx">Caixa (cx)</option>
                <option value="pct">Pacote (pct)</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2 items-center">
              <div>
                <label class="block text-[10px] font-semibold text-gray-500 mb-0.5">Data de Validade</label>
                <input type="date" id="cad-prod-validade" class="w-full p-1.5 border rounded-lg text-xs bg-white">
              </div>
              <div class="flex items-center gap-2 pt-3">
                <input type="checkbox" id="cad-prod-atalho" checked class="rounded text-teal-600">
                <label for="cad-prod-atalho" class="text-xs font-medium text-gray-700">Mostrar nos Atalhos</label>
              </div>
            </div>

            <button onclick="cadastrarOuAtualizarProduto()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg hover:bg-teal-700 transition text-xs shadow">
              + Salvar Entrada no Estoque
            </button>
          </div>

          <div class="border-t pt-3 space-y-2">
            <h3 class="font-semibold text-xs text-gray-500 uppercase tracking-wider">Produtos em Estoque (${produtos.length})</h3>
            <div class="space-y-1.5 max-h-56 overflow-y-auto">
              ${listaEstoqueHTML || '<p class="text-xs text-gray-400 italic text-center py-4">Nenhum produto cadastrado.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    // ABA 3: CLIENTES, FIADO E ABATIMENTO DE CONTAS
    function renderAbaClientes() {
      let clientesHTML = clientes.map((c, i) => `
        <div class="bg-gray-50 p-2.5 rounded-lg border text-xs space-y-2">
          <div class="flex justify-between items-center">
            <div>
              <p class="font-bold text-gray-800">${c.nome}</p>
              <p class="text-gray-500">Tel: ${c.telefone || 'Não informado'}</p>
            </div>
            <span class="font-extrabold ${c.debito > 0 ? 'text-red-600 bg-red-50 px-2 py-1 rounded border border-red-200' : 'text-green-600'}">
              Fiado: R$ ${parseFloat(c.debito || 0).toFixed(2)}
            </span>
          </div>

          ${c.debito > 0 ? `
            <div class="flex gap-2 pt-1 border-t border-gray-200">
              <input type="number" step="0.01" id="abatimento-val-${i}" placeholder="Valor abater R$" class="w-full p-1 border rounded text-xs">
              <button onclick="abaterDebitoCliente(${i})" class="bg-green-600 text-white font-bold px-2 py-1 rounded hover:bg-green-700 text-xs whitespace-nowrap">
                Abater / Pagar
              </button>
            </div>
          ` : '<p class="text-[10px] text-green-700 italic">Conta 100% em dia!</p>'}
        </div>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider flex items-center gap-1.5 border-b pb-2">
            <i class="fa-solid fa-users text-teal-600"></i> Cadastro de Clientes & Controle de Fiado
          </h2>

          <div class="space-y-2">
            <input type="text" id="cli-nome" placeholder="Nome do Cliente" class="w-full p-2 border rounded-lg text-xs">
            <input type="text" id="cli-tel" placeholder="Telefone / WhatsApp" class="w-full p-2 border rounded-lg text-xs">
            <button onclick="cadastrarCliente()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg hover:bg-teal-700 transition text-xs">
              + Cadastrar Cliente
            </button>
          </div>

          <div class="border-t pt-3 space-y-2">
            <h3 class="font-semibold text-xs text-gray-500 uppercase tracking-wider">Clientes Cadastrados (${clientes.length})</h3>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${clientesHTML || '<p class="text-xs text-gray-400 italic text-center py-4">Nenhum cliente cadastrado.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function abaterDebitoCliente(index) {
      const valInput = document.getElementById(`abatimento-val-${index}`);
      const valorAbater = parseFloat(valInput.value);

      if (!valorAbater || valorAbater <= 0) {
        alert("Digite um valor válido para abater!");
        return;
      }

      let cliente = clientes[index];
      cliente.debito = Math.max(0, cliente.debito - valorAbater);

      localStorage.setItem('crm_clientes', JSON.stringify(clientes));

      const user = auth.currentUser;
      if (user) {
        db.collection("clientes").doc(user.uid + "_" + cliente.id).set(cliente, { merge: true });
      }

      alert(`Abatimento de R$ ${valorAbater.toFixed(2)} registrado para ${cliente.nome}!`);
      renderAba();
    }

    // ABA 4: RELATÓRIOS E EXCEL
    function renderAbaRelatorios() {
      let vendasInvertidas = [...vendas].reverse();
      let ultimasVendasHTML = vendasInvertidas.map(v => `
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-xs">
          <div>
            <p class="font-bold text-gray-800">${v.item}</p>
            <p class="text-gray-400">${v.formaPagto} ${v.cliente ? '• ' + v.cliente : ''} • ${v.data}</p>
          </div>
          <span class="font-bold text-teal-700">R$ ${parseFloat(v.valor).toFixed(2)}</span>
        </div>
      `).join('');

      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <h2 class="font-bold text-gray-800 text-xs uppercase tracking-wider flex items-center gap-1.5 border-b pb-2">
            <i class="fa-solid fa-chart-line text-teal-600"></i> Histórico e Relatórios
          </h2>

          <button onclick="exportarBackupCSV()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 transition text-xs flex justify-center items-center gap-2 shadow">
            <i class="fa-solid fa-file-excel"></i> Baixar Relatório em Excel (.CSV)
          </button>

          <div class="border-t pt-3 space-y-2">
            <h3 class="font-semibold text-xs text-gray-500 uppercase tracking-wider">Histórico de Vendas (${vendas.length})</h3>
            <div class="space-y-1.5 max-h-64 overflow-y-auto">
              ${ultimasVendasHTML || '<p class="text-xs text-gray-400 italic text-center py-4">Nenhuma venda salva no histórico.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    // LÓGICA DE DADOS DO CARRINHO E ESTOQUE
    function adicionarAoCarrinho(index) {
      let prod = produtos[index];
      
      // Alerta / Vibração se estoque estiver zerado ou baixo
      if (prod.estoque <= 0) {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        alert(`Atenção: O produto "${prod.nome}" está com estoque zerado!`);
      }

      let item = carrinho.find(c => c.nome === prod.nome);
      if (item) { item.qtd += 1; }
      else { carrinho.push({ nome: prod.nome, preco: parseFloat(prod.preco), qtd: 1 }); }
      renderAba();
    }

    function adicionarManualAoCarrinho() {
      const nome = document.getElementById('venda-nome-manual').value;
      const valor = document.getElementById('venda-valor-manual').value;
      if (!nome || !valor) { alert("Informe o nome e valor do item avulso!"); return; }
      carrinho.push({ nome: nome, preco: parseFloat(valor), qtd: 1 });
      renderAba();
    }

    function removerDoCarrinho(index) {
      carrinho.splice(index, 1);
      renderAba();
    }

    function finalizarCarrinho() {
      if (carrinho.length === 0) { alert("O carrinho está vazio!"); return; }
      const pagto = document.getElementById('venda-pagto').value;
      const clienteFiado = document.getElementById('venda-cliente-fiado') ? document.getElementById('venda-cliente-fiado').value : '';

      if (pagto === 'Fiado' && !clienteFiado) {
        alert("Por favor, selecione o cliente para registrar o fiado!");
        return;
      }

      const user = auth.currentUser;
      const dataAtual = new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

      let totalVenda = 0;

      carrinho.forEach(item => {
        let prod = produtos.find(p => p.nome.toLowerCase() === item.nome.toLowerCase());
        if (prod && prod.estoque >= item.qtd) { prod.estoque -= item.qtd; }

        let valorItemTotal = item.preco * item.qtd;
        totalVenda += valorItemTotal;

        const novaVenda = {
          id: Date.now() + Math.random(),
          item: item.nome,
          valor: valorItemTotal,
          formaPagto: pagto,
          cliente: pagto === 'Fiado' ? clienteFiado : '',
          data: dataAtual
        };

        vendas.push(novaVenda);
        if (user) {
          db.collection("vendas").add({ ...novaVenda, userId: user.uid, userEmail: user.email, createdAt: new Date() });
        }
      });

      // Se for Fiado, adiciona ao débito do cliente
      if (pagto === 'Fiado' && clienteFiado) {
        let cli = clientes.find(c => c.nome === clienteFiado);
        if (cli) {
          cli.debito = (parseFloat(cli.debito) || 0) + totalVenda;
          localStorage.setItem('crm_clientes', JSON.stringify(clientes));
          if (user) {
            db.collection("clientes").doc(user.uid + "_" + cli.id).set(cli, { merge: true });
          }
        }
      }

      localStorage.setItem('crm_produtos', JSON.stringify(produtos));
      localStorage.setItem('crm_vendas', JSON.stringify(vendas));
      carrinho = [];
      alert("Venda realizada com sucesso!");
      renderAba();
    }

    function cadastrarOuAtualizarProduto() {
      const nome = document.getElementById('cad-prod-nome').value;
      const preco = document.getElementById('cad-prod-preco').value;
      const qtd = document.getElementById('cad-prod-qtd').value || 1;
      const medida = document.getElementById('cad-prod-medida').value;
      const validade = document.getElementById('cad-prod-validade').value;
      const atalho = document.getElementById('cad-prod-atalho').checked;

      if (!nome || !preco) { alert("Preencha o nome e o preço!"); return; }

      let prodExistente = produtos.find(p => p.nome.toLowerCase() === nome.toLowerCase());
      if (prodExistente) {
        prodExistente.preco = parseFloat(preco);
        prodExistente.estoque = (parseInt(prodExistente.estoque) || 0) + parseInt(qtd);
        prodExistente.medida = medida;
        prodExistente.atalho = atalho;
        if (validade) prodExistente.validade = validade;
      } else {
        produtos.push({ 
          id: Date.now(), 
          nome: nome, 
          preco: parseFloat(preco), 
          estoque: parseInt(qtd), 
          medida: medida,
          validade: validade || '',
          atalho: atalho 
        });
      }

      localStorage.setItem('crm_produtos', JSON.stringify(produtos));
      const user = auth.currentUser;
      if (user) {
        db.collection("produtos").doc(user.uid + "_" + nome).set({
          userId: user.uid, nome: nome, preco: parseFloat(preco),
          estoque: prodExistente ? prodExistente.estoque : parseInt(qtd),
          medida: medida, validade: validade || '', atalho: atalho
        }, { merge: true });
      }

      alert("Produto salvo no estoque!");
      renderAba();
    }

    function excluirProduto(index) {
      if (confirm("Remover este produto do estoque?")) {
        produtos.splice(index, 1);
        localStorage.setItem('crm_produtos', JSON.stringify(produtos));
        renderAba();
      }
    }

    function cadastrarCliente() {
      const nome = document.getElementById('cli-nome').value;
      const tel = document.getElementById('cli-tel').value;
      if (!nome) { alert("Digite o nome do cliente!"); return; }

      const novoCli = { id: Date.now(), nome: nome, telefone: tel, debito: 0 };
      clientes.push(novoCli);
      localStorage.setItem('crm_clientes', JSON.stringify(clientes));

      const user = auth.currentUser;
      if (user) {
        db.collection("clientes").doc(user.uid + "_" + novoCli.id).set({ ...novoCli, userId: user.uid });
      }

      alert("Cliente cadastrado!");
      renderAba();
    }

    function exportarBackupCSV() {
      if (vendas.length === 0) { alert("Sem histórico de vendas para exportar."); return; }
      let csvContent = "data:text/csv;charset=utf-8,ID,Item,Valor,FormaPagamento,Cliente,Data\n";
      vendas.forEach(v => { csvContent += `${v.id},"${v.item}",${v.valor},"${v.formaPagto}","${v.cliente || ''}","${v.data}"\n`; });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Vendas_${perfilNegocio.nomeLoja.replace(/\s+/g, '_')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // MONITOR DE SESSÃO DO FIREBASE
    auth.onAuthStateChanged((user) => {
      const statusText = document.getElementById('user-status');
      if (user) {
        statusText.innerText = "Online • " + user.email;
        db.collection("perfis").doc(user.uid).get().then(doc => {
          if (doc.exists) {
            perfilNegocio = doc.data();
            localStorage.setItem('crm_perfil', JSON.stringify(perfilNegocio));
          }
          renderAba();
        }).catch(() => renderAba());
      } else {
        statusText.innerText = "Desconectado";
        showOnboardingStep1();
      }
    });

    document.getElementById('menu-logout').addEventListener('click', (e) => {
      e.preventDefault();
      auth.signOut().then(() => alert('Você desconectou.'));
    });

    console.log("Caixa Rápido Móvel Pro Completo carregado com sucesso!");
  </script>
</body>
</html>
