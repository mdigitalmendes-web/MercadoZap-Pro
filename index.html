<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa Rápido Móvel Pro</title>
  
  <!-- Estilos e Design (Tailwind CSS + FontAwesome) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    .whatsapp-green { background-color: #075e54; }
    .whatsapp-teal { background-color: #128c7e; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- BARRA SUPERIOR (HEADER) ESTILO WHATSAPP -->
  <header class="whatsapp-green text-white p-4 flex justify-between items-center shadow-md z-10">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-cash-register text-2xl"></i>
      <div>
        <h1 class="font-bold text-lg leading-tight">Caixa Rápido Móvel Pro</h1>
        <p id="user-status" class="text-xs text-green-200">Verificando conexão...</p>
      </div>
    </div>
    
    <!-- MENU DE TRÊS PONTINHOS (⋮) -->
    <div class="relative">
      <button id="btn-menu" class="text-white p-2 text-xl focus:outline-none">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>

      <!-- DROPDOWN DO MENU -->
      <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-md shadow-lg border border-gray-200 z-50">
        <a href="#" id="menu-perfil" class="block px-4 py-2 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-store text-gray-600"></i> Perfil do Negócio</a>
        <a href="#" id="menu-backup" class="block px-4 py-2 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-file-excel text-green-600"></i> Exportar / Backup</a>
        <hr class="my-1 border-gray-200">
        <a href="#" id="menu-logout" class="block px-4 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</a>
      </div>
    </div>
  </header>

  <!-- TELA PRINCIPAL (CONTEÚDO) -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full">
    
    <!-- CONTAINER DINÂMICO -->
    <div id="main-content" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <div class="text-center py-6">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-teal-600 mb-3"></i>
        <p class="text-gray-600 font-medium">Carregando o aplicativo...</p>
      </div>
    </div>

  </main>

  <!-- BIBLIOTECAS DO FIREBASE (NUVEM DO GOOGLE) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- LÓGICA DO APLICATIVO E CHAVES DO PROJETO -->
  <script>
    // 1. Chaves Oficiais do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDlmmLaKNqlaze-Rreqw2cOWBhXoebeG7g",
      authDomain: "caixa-rapido-movel.firebaseapp.com",
      projectId: "caixa-rapido-movel",
      storageBucket: "caixa-rapido-movel.firebasestorage.app",
      messagingSenderId: "741349314946",
      appId: "1:741349314946:web:640b8d2baa0e257ed13f9b"
    };

    // 2. Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 3. Controle do Menu de Três Pontinhos (⋮)
    const btnMenu = document.getElementById('btn-menu');
    const dropdownMenu = document.getElementById('dropdown-menu');

    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
    });

    // 4. Alternar entre as telas de Login e Cadastro
    function showLoginForm() {
      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <div class="text-center">
            <i class="fa-solid fa-user-check text-4xl text-teal-600 mb-2"></i>
            <h2 class="text-xl font-bold text-gray-800">Entrar na Conta</h2>
            <p class="text-xs text-gray-500">Acesse suas vendas salvas na nuvem</p>
          </div>

          <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
              <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Senha</label>
              <input type="password" id="login-password" required placeholder="******" class="w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
            
            <p id="auth-error" class="text-xs text-red-500 font-medium hidden text-center"></p>

            <button type="submit" id="btn-submit-login" class="w-full bg-teal-600 text-white font-semibold py-2.5 rounded-lg hover:bg-teal-700 transition flex justify-center items-center gap-2">
              <span>Entrar</span>
            </button>
          </form>

          <div class="border-t pt-3 text-center">
            <p class="text-xs text-gray-600">Ainda não tem conta?</p>
            <button onclick="showRegisterForm()" class="text-xs font-bold text-teal-700 hover:underline mt-1">Criar nova conta</button>
          </div>
        </div>
      `;
    }

    function showRegisterForm() {
      document.getElementById('main-content').innerHTML = `
        <div class="space-y-4">
          <div class="text-center">
            <i class="fa-solid fa-user-plus text-4xl text-teal-600 mb-2"></i>
            <h2 class="text-xl font-bold text-gray-800">Criar Nova Conta</h2>
            <p class="text-xs text-gray-500">Cadastre-se para começar a usar a nuvem</p>
          </div>

          <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail de acesso</label>
              <input type="email" id="reg-email" required placeholder="seu@email.com" class="w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Senha de acesso (mínimo 6 dígitos)</label>
              <input type="password" id="reg-password" required minlength="6" placeholder="******" class="w-full p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
            </div>
            
            <p id="auth-error" class="text-xs text-red-500 font-medium hidden text-center"></p>

            <button type="submit" id="btn-submit-reg" class="w-full bg-teal-600 text-white font-semibold py-2.5 rounded-lg hover:bg-teal-700 transition flex justify-center items-center gap-2">
              <span>Cadastrar e Entrar</span>
            </button>
          </form>

          <div class="border-t pt-3 text-center">
            <p class="text-xs text-gray-600">Já possui uma conta?</p>
            <button onclick="showLoginForm()" class="text-xs font-bold text-teal-700 hover:underline mt-1">Voltar para o Login</button>
          </div>
        </div>
      `;
    }

    // 5. Funções de Autenticação no Firebase
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const errBox = document.getElementById('auth-error');

      errBox.classList.add('hidden');
      auth.signInWithEmailAndPassword(email, pass).catch(err => {
        errBox.innerText = "Erro ao entrar: " + (err.message.includes("user-not-found") ? "Usuário não encontrado" : "E-mail ou senha incorretos.");
        errBox.classList.remove('hidden');
      });
    }

    function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;
      const errBox = document.getElementById('auth-error');

      errBox.classList.add('hidden');
      auth.createUserWithEmailAndPassword(email, pass).catch(err => {
        errBox.innerText = "Erro ao cadastrar: " + (err.message.includes("email-already-in-use") ? "Este e-mail já está em uso." : err.message);
        errBox.classList.remove('hidden');
      });
    }

    // 6. Monitor de Estado de Login do Usuário
    auth.onAuthStateChanged((user) => {
      const statusText = document.getElementById('user-status');
      const mainContent = document.getElementById('main-content');

      if (user) {
        statusText.innerText = "Online • " + user.email;
        mainContent.innerHTML = `
          <div class="space-y-4">
            <div class="bg-green-50 border border-green-200 p-3 rounded-lg flex items-center gap-3">
              <i class="fa-solid fa-cloud-check text-green-600 text-xl"></i>
              <div>
                <h3 class="font-bold text-green-800 text-sm">Nuvem Conectada</h3>
                <p class="text-xs text-green-700">Conectado como: ${user.email}</p>
              </div>
            </div>

            <!-- PAINEL DE CAIXA DE VENDAS -->
            <div class="border-t pt-3 space-y-3">
              <h2 class="font-bold text-gray-800 text-base flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-teal-600"></i> Registrar Venda Rápidas
              </h2>

              <div class="space-y-2">
                <input type="text" id="produto-nome" placeholder="Nome do Produto / Serviço" class="w-full p-2 border rounded-lg text-sm">
                <input type="number" id="produto-preco" placeholder="Valor (R$)" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="salvarVendaSimples()" class="w-full bg-whatsapp-teal text-white font-bold py-2 rounded-lg hover:opacity-90 transition">
                  + Confirmar Venda
                </button>
              </div>
            </div>

            <div id="lista-vendas-box" class="border-t pt-3">
              <h3 class="font-semibold text-xs text-gray-500 uppercase tracking-wider mb-2">Últimas Atividades</h3>
              <p class="text-xs text-gray-400 italic text-center py-2">Nenhuma venda registrada ainda hoje.</p>
            </div>
          </div>
        `;
      } else {
        statusText.innerText = "Desconectado";
        showLoginForm();
      }
    });

    // 7. Salvar Venda no Firestore
    function salvarVendaSimples() {
      const nome = document.getElementById('produto-nome').value;
      const preco = document.getElementById('produto-preco').value;
      const user = auth.currentUser;

      if (!nome || !preco) {
        alert("Preencha o nome e o valor do produto!");
        return;
      }

      db.collection("vendas").add({
        userId: user.uid,
        userEmail: user.email,
        produto: nome,
        valor: parseFloat(preco),
        data: new Date()
      }).then(() => {
        alert("Venda salva com sucesso na nuvem!");
        document.getElementById('produto-nome').value = '';
        document.getElementById('produto-preco').value = '';
      }).catch(err => {
        alert("Erro ao salvar venda: " + err.message);
      });
    }

    // 8. Botão de Sair
    document.getElementById('menu-logout').addEventListener('click', (e) => {
      e.preventDefault();
      auth.signOut().then(() => {
        alert('Você saiu da conta!');
      });
    });

    console.log("Caixa Rápido Móvel Pro pronto!");
  </script>
</body>
</html>
