<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa Rápido Móvel Pro</title>
  
  <!-- Estilos e Design (Tailwind CSS + FontAwesome) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
    .whatsapp-green { background-color: #075e54; }
    .whatsapp-teal { background-color: #128c7e; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- BARRA SUPERIOR (HEADER) ESTILO WHATSAPP -->
  <header class="whatsapp-green text-white p-4 flex justify-between items-center shadow-md z-10">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-cash-register text-2xl"></i>
      <div>
        <h1 class="font-bold text-lg leading-tight">Caixa Rápido Móvel Pro</h1>
        <p id="user-status" class="text-xs text-green-200">Conectando à nuvem...</p>
      </div>
    </div>
    
    <!-- MENU DE TRÊS PONTINHOS (⋮) -->
    <div class="relative">
      <button id="btn-menu" class="text-white p-2 text-xl focus:outline-none">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>

      <!-- DROPDOWN DO MENU -->
      <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-md shadow-lg border border-gray-200 z-50">
        <a href="#" id="menu-perfil" class="block px-4 py-2 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-store text-gray-600"></i> Perfil do Negócio</a>
        <a href="#" id="menu-backup" class="block px-4 py-2 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-file-excel text-green-600"></i> Exportar / Backup</a>
        <hr class="my-1 border-gray-200">
        <a href="#" id="menu-logout" class="block px-4 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</a>
      </div>
    </div>
  </header>

  <!-- TELA PRINCIPAL (CONTEÚDO) -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full">
    
    <!-- ÁREA DE CARREGAMENTO / TELA DE VENDAS -->
    <div id="main-content" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-teal-600 mb-3"></i>
      <p class="text-gray-600 font-medium">Carregando sistema de vendas e nuvem...</p>
    </div>

  </main>

  <!-- BIBLIOTECAS DO FIREBASE (NUVEM DO GOOGLE) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- LÓGICA DO APLICATIVO E CHAVES DO PROJETO -->
  <script>
    // 1. Chaves Oficiais do Firebase (Caixa Rápido Móvel Pro)
    const firebaseConfig = {
      apiKey: "AIzaSyDlmmLaKNqlaze-Rreqw2cOWBhXoebeG7g",
      authDomain: "caixa-rapido-movel.firebaseapp.com",
      projectId: "caixa-rapido-movel",
      storageBucket: "caixa-rapido-movel.firebasestorage.app",
      messagingSenderId: "741349314946",
      appId: "1:741349314946:web:640b8d2baa0e257ed13f9b"
    };

    // 2. Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 3. Controle do Menu de Três Pontinhos (⋮)
    const btnMenu = document.getElementById('btn-menu');
    const dropdownMenu = document.getElementById('dropdown-menu');

    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
    });

    // 4. Verificação de Conexão com o Firebase
    auth.onAuthStateChanged((user) => {
      const statusText = document.getElementById('user-status');
      const mainContent = document.getElementById('main-content');

      if (user) {
        statusText.innerText = "Online • " + (user.email || "Usuário");
        mainContent.innerHTML = `
          <div class="text-left space-y-4">
            <div class="bg-green-50 border border-green-200 p-4 rounded-lg flex items-center gap-3">
              <i class="fa-solid fa-cloud-check text-green-600 text-2xl"></i>
              <div>
                <h3 class="font-bold text-green-800">Nuvem Conectada!</h3>
                <p class="text-xs text-green-700">Seus dados e vendas estão sendo salvos com segurança.</p>
              </div>
            </div>
            
            <div class="border-t pt-4">
              <h2 class="font-bold text-gray-700 mb-2">Painel de Caixa Rápido</h2>
              <p class="text-sm text-gray-500">Pronto para iniciar cadastros de produtos e registrar vendas.</p>
            </div>
          </div>
        `;
      } else {
        statusText.innerText = "Desconectado (Modo offline)";
        mainContent.innerHTML = `
          <div class="text-center space-y-4">
            <i class="fa-solid fa-lock text-4xl text-teal-600 mb-2"></i>
            <h2 class="text-lg font-bold text-gray-800">Bem-vindo ao Caixa Rápido Móvel Pro</h2>
            <p class="text-xs text-gray-500">Faça login ou crie sua conta para sincronizar suas vendas na nuvem.</p>
            
            <div class="space-y-2 pt-2">
              <button onclick="alert('Tela de Login em estruturação!')" class="w-full bg-teal-600 text-white font-semibold py-2 rounded-lg hover:bg-teal-700 transition">
                Entrar na Conta
              </button>
              <button onclick="alert('Tela de Cadastro em estruturação!')" class="w-full bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-200 transition">
                Criar Nova Conta
              </button>
            </div>
          </div>
        `;
      }
    });

    // 5. Ação do Botão de Sair
    document.getElementById('menu-logout').addEventListener('click', (e) => {
      e.preventDefault();
      auth.signOut().then(() => {
        alert('Você saiu da conta!');
      });
    });

    console.log("Caixa Rápido Móvel Pro carregado com sucesso!");
  </script>
</body>
</html>
